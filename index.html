                        </div>
                        <Icon name="ChevronDown" size={20} className="text-slate-400" />
                    </div>

                    {data && (
                        <>
                            <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex flex-wrap gap-3 items-center mt-4">

                                <Badge color="blue" icon={Ship}>{data.resumo.navioViagem}</Badge>

                            <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden mt-4">
                                <div className="px-5 pt-5 border-b border-gray-200">
                                    <div className="flex gap-6">
                                        {tabs.map(tab => (
                                            <button key={tab} onClick={() => setActiveTab(tab)} className={`pb-3 text-sm font-medium border-b-2 ${activeTab === tab ? "border-blue-600 text-blue-600" : "border-transparent text-gray-500"}`}>{tab}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-6 bg-white min-h-[300px]">
                                    {activeTab === "Geral" && (
                                        <div className="grid grid-cols-4 gap-4">
                                            <InputField label="CE Mercante" value={data.geral.ceMercante} readOnly />
                                            <InputField label="RUC" value={data.geral.ruc} readOnly />

                                            <tbody>{data.documentos.map((d, i) => <tr key={i} className="hover:bg-gray-50"><td className="p-3 font-bold">{d.documento}</td><td className="p-3">{d.numero}</td><td className="p-3">{d.emissor}</td><td className="p-3">{d.data}</td><td className="p-3"><span className="bg-gray-100 px-2 py-0.5 rounded text-xs">{d.vinculo}</span></td></tr>)}</tbody>

                                    )}
                                    {activeTab === "Payload (JSON)" && (
                                        <div className="bg-gray-50 p-4 rounded border font-mono text-xs">{data.payload}</div>
                                    )}
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        // TELA 2
        const TelaViagens = ({ showToast, viagensList, setViagensList, onNavigateToImportacao }) => {
            const [selectedId, setSelectedId] = useState(null);
            const [formData, setFormData] = useState({ id: null, viagem: "", codNavio: "", navio: "", chegada: "", horaChegada: "", armazem: "", captacao: false, solTransf: false, dt: false, manifesto: false, recinto: "", tipoEscala: "normal" });

            const handleRowClick = (item) => { setSelectedId(item.id); setFormData(item); };
            const handleInputChange = (field, value) => { setFormData(prev => ({ ...prev, [field]: value })); };
            const handleGenerateData = () => {
                const novoNavio = getRandomElem(NAVIOS);
                const ano = new Date().getFullYear() + 1;
                setFormData({ id: Date.now(), viagem: `${getRandomInt(1000, 9999)}/${ano}`, codNavio: getRandomInt(10000, 99999).toString(), navio: novoNavio, chegada: "01/01/" + ano, horaChegada: "14:30:00", armazem: `BERTH ${getRandomInt(1, 10)}`, tipoEscala: "normal", captacao: false, solTransf: false, dt: false, manifesto: false, recinto: "EUDMARCO", isNew: true });
                setSelectedId(null);
                showToast("Dados gerados! Clique em SALVAR para adicionar à lista.", "info");
            };
            const handleSave = () => {
                if (!formData.viagem || !formData.navio) { showToast("Preencha os campos obrigatórios.", "error"); return; }
                setViagensList(prevList => {
                    const exists = prevList.find(v => v.id === formData.id);
                    if (exists) { return prevList.map(v => v.id === formData.id ? formData : v); } 
                    else { const { isNew, ...dataToSave } = formData; const newRecord = { ...dataToSave, id: formData.id || Date.now() }; return [newRecord, ...prevList]; }
                });
                showToast("Registro salvo com sucesso!", "success");
            };

            return (
                <div className="p-6 space-y-4 bg-slate-50 min-h-screen">
                    <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                        <div className="bg-gray-100 px-4 py-2 border-b border-gray-200 flex justify-between items-center"><h2 className="text-sm font-bold text-gray-700">Cadastros</h2><MagicButton onClick={handleGenerateData} /></div>
                        <div className="p-5 space-y-5">
                            <div className="grid grid-cols-12 gap-4">
                                <div className="col-span-2"><InputField label="Nº Viagem" value={formData.viagem} onChange={(e) => handleInputChange('viagem', e.target.value)} /></div>
                                <div className="col-span-2"><InputField label="Cód. Navio" value={formData.codNavio} onChange={(e) => handleInputChange('codNavio', e.target.value)} /></div>
                                <div className="col-span-6"><InputField label="Nome Navio" value={formData.navio} onChange={(e) => handleInputChange('navio', e.target.value)} /></div>
                                <div className="col-span-2"><InputField label="Data Chegada" value={formData.chegada} onChange={(e) => handleInputChange('chegada', e.target.value)} /></div>
                            </div>
                            <div className="grid grid-cols-12 gap-4">
                                <div className="col-span-2"><InputField label="Hora Chegada" value={formData.horaChegada} onChange={(e) => handleInputChange('horaChegada', e.target.value)} /></div>
                                <div className="col-span-2"><InputField label="Armazém" value={formData.armazem} onChange={(e) => handleInputChange('armazem', e.target.value)} /></div>
                                <div className="col-span-4 border rounded p-2 bg-gray-50/50"><RadioGroup title="Tipo de Escala" name="tipoEscala" selectedValue={formData.tipoEscala} onChange={(val) => handleInputChange('tipoEscala', val)} options={[{ label: "Normal", value: "normal" }, { label: "Descarga", value: "descarga" }]} /></div>

                            <div className="flex gap-2 justify-end mt-4"><button onClick={handleSave} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white border border-blue-600 rounded shadow-sm text-xs font-bold hover:bg-blue-700"><Save size={14}/> Salvar</button></div>

                    <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">

                            <tbody className="divide-y divide-gray-100 bg-blue-50/30">
                                {viagensList.map((row) => (

                                        <td className="px-4 py-3 text-right"><button onClick={(e) => { e.stopPropagation(); onNavigateToImportacao(row); }} className="px-3 py-1 bg-white border border-blue-200 text-blue-600 rounded text-xs hover:bg-blue-50 flex items-center gap-1 ml-auto">Ir para Importação <ArrowRight size={12}/></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // TELA 3
        const TelaImportacao = ({ showToast, onNavigate, viagemSelecionada, onEnviarParaCaptacao }) => {
            const [associatedVessel, setAssociatedVessel] = useState(null);
            const [selectedBls, setSelectedBls] = useState({});
            const [blList, setBlList] = useState([]);

            useEffect(() => {
                if (viagemSelecionada) {
                    setAssociatedVessel({ navio: viagemSelecionada.navio, viagem: viagemSelecionada.viagem, connected: false });
                    generateBlsForVessel(viagemSelecionada.navio);
                } else { handleGenerateData(false); }
            }, [viagemSelecionada]);

            const generateBlsForVessel = (navioName) => {
                setBlList([{ id: 1, lote: `L${getRandomInt(1000,9999)}`, bl: generateBL(), qtdHbl: 1, armador: "MSC", consignatario: getRandomElem(IMPORTADORES), cntr: 2, navio: navioName }, { id: 2, lote: `L${getRandomInt(1000,9999)}`, bl: generateBL(), qtdHbl: 0, armador: "MAERSK", consignatario: getRandomElem(IMPORTADORES), cntr: 1, navio: navioName }]);
            };
            const handleGenerateData = (toast = true) => {
                const navio = getRandomElem(NAVIOS);
                setBlList([{ id: 1, lote: `L${getRandomInt(1000,9999)}`, bl: generateBL(), qtdHbl: 1, armador: "MSC", consignatario: getRandomElem(IMPORTADORES), cntr: 2, navio }, { id: 2, lote: `L${getRandomInt(1000,9999)}`, bl: generateBL(), qtdHbl: 0, armador: "MAERSK", consignatario: getRandomElem(IMPORTADORES), cntr: 1, navio }]);
                setAssociatedVessel({ navio: navio, viagem: `${getRandomInt(10,99)}E`, connected: false });
                setSelectedBls({});
                if(toast) showToast("Novos BLs carregados!", "info");
            };
            const handleAssociate = () => { if (!associatedVessel) return; setAssociatedVessel(prev => ({ ...prev, connected: true, lloyd: getRandomInt(9000000, 9999999).toString(), atr: `${getRandomInt(1000,9999)}/${new Date().getFullYear()}`, grupo: "EJO" })); showToast("Viagem associada com sucesso!", "success"); };
            const handleSendToCaptacao = () => {
                const selectedIds = Object.keys(selectedBls).filter(k => selectedBls[k]);
                if (selectedIds.length === 0) { showToast("Selecione ao menos um BL.", "error"); return; }
                if (!associatedVessel?.connected) { showToast("Associe a viagem antes.", "error"); return; }
                const blsToSend = blList.filter(bl => selectedIds.includes(bl.id.toString()));
                onEnviarParaCaptacao(blsToSend);
                showToast("BLs enviados para Captação!", "success");
                setTimeout(() => onNavigate(4), 1000);
            };

                    </div>
                    <div className="bg-white rounded-lg border border-gray-200 shadow-sm">
                        <div className="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center"><h3 className="font-bold text-gray-700 text-sm">Lista de BLs para {associatedVessel?.navio}</h3><button onClick={handleSendToCaptacao} className="px-3 py-1.5 text-xs bg-blue-600 text-white rounded shadow-sm hover:bg-blue-700 font-medium">Enviar p/ Captação</button></div>
                        <table className="w-full text-left text-sm"><thead className="text-xs text-gray-500 uppercase bg-gray-50"><tr><th className="px-4 py-3 w-8"><input type="checkbox"/></th><th>BL</th><th>Armador</th><th>Consignatário</th><th>Containers</th></tr></thead><tbody>{blList.map(item => (<tr key={item.id} className={selectedBls[item.id] ? "bg-blue-50" : ""}><td className="px-4 py-3"><input type="checkbox" checked={selectedBls[item.id] || false} onChange={() => setSelectedBls(p => ({...p, [item.id]: !p[item.id]}))} /></td><td className="px-4 py-3 font-medium text-blue-600">{item.bl}</td><td className="px-4 py-3 text-gray-600">{item.armador}</td><td className="px-4 py-3 text-gray-600 truncate max-w-[150px]">{item.consignatario}</td><td className="px-4 py-3 text-center"><span className="bg-gray-100 px-2 py-0.5 rounded text-xs">{item.cntr} CNTR</span></td></tr>))}</tbody></table>
                    </div>
                </div>
            );
        };

        // TELA 4
        const TelaCaptacao = ({ showToast, onAddSolicitacao, blsParaCaptacao }) => {
            const [activeBlIndex, setActiveBlIndex] = useState(0);
            const [form, setForm] = useState({ lote: "", bl: "", navio: "", viagem: "", importador: "", despachante: "", ce: "", volume: "" });

            useEffect(() => {
                if (blsParaCaptacao && blsParaCaptacao.length > 0) {
                    const blData = blsParaCaptacao[activeBlIndex];
                    setForm({ lote: blData.lote, bl: blData.bl, navio: blData.navio || "MSC ELLEN", viagem: "LUX-50R", importador: blData.consignatario, despachante: getRandomElem(DESPACHANTES), ce: generateCE(), volume: `${getRandomInt(20, 100)}.5 m³` });
                }
            }, [blsParaCaptacao, activeBlIndex]);

            const handleGenerateData = () => { setForm({ lote: `LOTE-${new Date().getFullYear()}/${getRandomInt(100,999)}`, bl: generateBL(), navio: getRandomElem(NAVIOS), viagem: `${getRandomInt(10,99)}W`, importador: getRandomElem(IMPORTADORES), despachante: getRandomElem(DESPACHANTES), ce: generateCE(), volume: `${getRandomInt(20, 100)}.5 m³` }); showToast("Dados preenchidos!", "info"); };
            const handleValidate = () => { if (!form.bl || !form.importador) { showToast("Preencha campos obrigatórios.", "error"); return false; } return true; };
            const handleSave = () => { if(handleValidate()) showToast("Captação salva localmente.", "success"); };
            const handleSendDTE = () => { if(handleValidate()) { showToast("Enviando pacote à DTE...", "info"); setTimeout(() => { showToast("Protocolo DTE recebido!", "success"); if (onAddSolicitacao) { onAddSolicitacao({ id: getRandomInt(300000, 399999), sigla: generateContainer(), tipo: "40 HC", status: "AGUARDANDO RETORNO", bl: form.bl, statusDt: "PENDENTE" }); } }, 1500); } };

            return (
                <div className="flex h-full">
                    {blsParaCaptacao.length > 1 && (<div className="w-48 bg-white border-r border-gray-200 p-4 overflow-y-auto"><h3 className="text-xs font-bold text-gray-500 uppercase mb-3">BLs Selecionados</h3><div className="space-y-2">{blsParaCaptacao.map((bl, idx) => (<button key={bl.id} onClick={() => setActiveBlIndex(idx)} className={`w-full text-left p-2 rounded text-xs ${activeBlIndex === idx ? 'bg-blue-50 text-blue-700 font-bold border border-blue-200' : 'text-gray-600 hover:bg-gray-50'}`}>{bl.bl}</button>))}</div></div>)}
                    <div className="flex-1 p-6 space-y-6 bg-slate-50 min-h-screen pb-20 overflow-y-auto">
                        <div className="flex justify-between items-center sticky top-0 bg-slate-50 py-2 z-10"><h2 className="text-xl font-bold text-slate-800">Captação (Cadastro do BL)</h2><div className="flex gap-2"><MagicButton onClick={handleGenerateData} /><div className="w-px h-8 bg-gray-300 mx-1"></div><button onClick={handleSave} className="px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded shadow-sm text-sm hover:bg-gray-50">Salvar</button><button onClick={handleSendDTE} className="px-4 py-2 bg-blue-600 text-white rounded shadow-sm text-sm hover:bg-blue-700 font-medium">Enviar DTE</button></div></div>
                        <div className="bg-white p-6 rounded-lg border border-gray-200 shadow-sm space-y-4"><h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Dados do BL: {form.bl}</h3><div className="grid grid-cols-4 gap-4"><InputField label="BL" value={form.bl} onChange={e => setForm({...form, bl: e.target.value})} className="col-span-1" /><InputField label="Navio" value={form.navio} onChange={e => setForm({...form, navio: e.target.value})} className="col-span-1" /><InputField label="Importador" value={form.importador} onChange={e => setForm({...form, importador: e.target.value})} className="col-span-2" /><InputField label="CE Mercante / RUC" value={form.ce} onChange={e => setForm({...form, ce: e.target.value})} className="col-span-2" /><InputField label="Despachante" value={form.despachante} onChange={e => setForm({...form, despachante: e.target.value})} className="col-span-2" /><InputField label="Lote" value={form.lote} readOnly className="col-span-1" /></div></div>
                    </div>
                </div>
            );
        };

        // TELA 5
        const TelaFechamento = ({ showToast, solicitacoesList }) => {
            const [dtStatus, setDtStatus] = useState("AGUARDANDO RETORNO");
            const handleCloseDT = () => { if (dtStatus === "CONCLUÍDO") { showToast("DT já fechada.", "warning"); return; } setDtStatus("CONCLUÍDO"); showToast("Fechamento realizado!", "success"); };
            return (
                <div className="p-6 space-y-6 bg-slate-50 min-h-screen">
                    <div className="flex justify-between items-center"><h2 className="text-xl font-bold text-slate-800">Fechamento de DT</h2></div>
                    <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex justify-between items-center text-sm"><div className="grid grid-cols-4 gap-8 w-full"><div><p className="text-xs text-gray-500 uppercase">DT</p><p className="font-bold text-lg">016383-7/2025</p></div><div><p className="text-xs text-gray-500 uppercase">Status</p><span className={`px-2 py-0.5 rounded text-xs font-bold ${dtStatus === 'CONCLUÍDO' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>{dtStatus}</span></div><div className="text-right col-span-2"><button onClick={handleCloseDT} className={`px-4 py-2 rounded shadow font-medium ${dtStatus === "CONCLUÍDO" ? "bg-gray-300 text-gray-500 cursor-not-allowed" : "bg-green-600 text-white hover:bg-green-700"}`}>{dtStatus === "CONCLUÍDO" ? "Fechamento Realizado" : "Efetuar Fechamento"}</button></div></div></div>
                    <div className="flex gap-4"><div className="flex-1 bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden"><table className="w-full text-left text-sm"><thead className="bg-gray-100 text-gray-600 uppercase text-xs"><tr><th className="px-4 py-3">Id Sol.</th><th>Sigla</th><th>Status Solicitação</th><th>BL</th></tr></thead><tbody className="divide-y divide-gray-100">{solicitacoesList.map(row => (<tr key={row.id} className="hover:bg-gray-50 animate-fade-in"><td className="px-4 py-3 text-gray-500">{row.id}</td><td className="px-4 py-3 font-medium">{row.sigla}</td><td className="px-4 py-3 text-xs font-bold text-blue-600">{row.status}</td><td className="px-4 py-3 text-gray-700">{row.bl}</td></tr>))}</tbody></table></div></div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const App = () => {
            const [currentScreen, setCurrentScreen] = useState(1);
            const [toast, setToast] = useState(null);
            
            // Estados globais para persistência
            const [viagensList, setViagensList] = useState(INITIAL_VIAGENS);
            const [solicitacoesList, setSolicitacoesList] = useState(INITIAL_SOLICITACOES);
            
            // Estados de workflow (passagem de dados)
            const [viagemSelecionada, setViagemSelecionada] = useState(null);
            const [blsParaCaptacao, setBlsParaCaptacao] = useState([]);

            const showToast = (message, type = 'info') => { setToast({ message, type }); setTimeout(() => setToast(null), 3500); };
            const addSolicitacao = (newItem) => { setSolicitacoesList(prev => [newItem, ...prev]); };
            const navigateToImportacao = (viagem) => { setViagemSelecionada(viagem); setCurrentScreen(3); };
            const enviarParaCaptacao = (bls) => { setBlsParaCaptacao(bls); };

            const screens = [
                { id: 1, name: "Consulta CE", icon: Search, component: <TelaConsultaCE showToast={showToast} /> },
                { id: 2, name: "Painel Viagens", icon: Ship, component: <TelaViagens showToast={showToast} viagensList={viagensList} setViagensList={setViagensList} onNavigateToImportacao={navigateToImportacao} /> },
                { id: 3, name: "Importação BLs", icon: Download, component: <TelaImportacao showToast={showToast} onNavigate={setCurrentScreen} viagemSelecionada={viagemSelecionada} onEnviarParaCaptacao={enviarParaCaptacao} /> },
                { id: 4, name: "Captação", icon: FileText, component: <TelaCaptacao showToast={showToast} onAddSolicitacao={addSolicitacao} blsParaCaptacao={blsParaCaptacao} /> },
                { id: 5, name: "Fechamento DT", icon: CheckCircle, component: <TelaFechamento showToast={showToast} solicitacoesList={solicitacoesList} /> },
            ];

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden font-sans">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center overflow-hidden">
                                <Anchor className="text-white" size={20} />
                            </div>
                            <span className="font-bold text-white tracking-wide">CAPTAÇÃO HX</span>
                        </div>
                        <nav className="flex-1 py-6 px-3 space-y-1">{screens.map(screen => (<button key={screen.id} onClick={() => setCurrentScreen(screen.id)} className={`w-full flex items-center gap-3 px-3 py-3 rounded-md text-sm font-medium transition-all ${currentScreen === screen.id ? "bg-blue-600 text-white shadow-lg shadow-blue-900/50" : "hover:bg-slate-800 hover:text-white"}`}><screen.icon size={18} /> {screen.name} {currentScreen === screen.id && <ChevronRight size={14} className="ml-auto opacity-75" />}</button>))}</nav>
                    </aside>
                    <main className="flex-1 flex flex-col min-w-0 overflow-hidden relative"><div className="flex-1 overflow-auto bg-slate-50 scrollbar-thin scrollbar-thumb-gray-300 h-full">{screens.find(s => s.id === currentScreen)?.component}</div></main>
                </div>
            );
        };

        // Renderização
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body></html>
